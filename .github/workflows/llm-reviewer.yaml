name: llm-reviewer
on: 
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs: 
  comment:
    if: github.event.issue.pull_request && github.event.comment.body == 'please review'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Post hello world comment
      uses: './.github/actions/llm-code-reviewer'
      with:
        pr_number: ${{ github.event.pull_request.number }}
        owner: ${{ github.repository_owner }}
        repo: ${{ github.repository.name }}