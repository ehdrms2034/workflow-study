name: Claude Code
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR의 코드 변경사항을 아래 항목에 따라 리뷰해줘.

            ## 1. PR 요약
            - 변경된 파일 목록과 각 파일의 주요 변경 내용을 간략히 설명해줘

            ## 2. 코드 리뷰
            - 버그 또는 잠재적 오류가 있는 코드를 찾아줘
            - 코드 가독성 및 유지보수성 관점에서 개선이 필요한 부분을 알려줘
            - 성능 상 문제가 될 수 있는 부분이 있으면 지적해줘
            - 보안 취약점이 있는 경우 반드시 언급해줘

            ## 3. 제안사항
            - 리팩토링이나 코드 개선을 위한 구체적인 제안을 해줘
            - 좋은 점도 함께 언급해줘

            ## 4. 종합 의견
            - 전반적인 코드 품질에 대한 의견과 머지 가능 여부를 알려줘
